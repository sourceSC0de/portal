<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>introverTrader - ATAS License Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0d1117;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .portal-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h2 { margin-top: 0; font-size: 20px; color: #fff; }
        p { color: #8b949e; font-size: 13px; line-height: 1.5; }
        .key-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 16px;
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        code {
            font-family: monospace;
            font-size: 15px;
            color: #58a6ff;
            font-weight: bold;
            word-break: break-all;
        }
        button {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            white-space: nowrap;
            transition: background 0.2s;
        }
        button:hover { background: #2ea043; }
        .btn-download {
            display: block;
            text-align: center;
            background: #f0f6fc;
            color: #0d1117;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            margin-top: 20px;
        }
        .btn-download:hover { background: #ce-d7de; }
        .loading { color: #8b949e; font-style: italic; }
        .error { color: #f85149; background: rgba(248,81,73,0.1); padding: 12px; border-radius: 6px; border: 1px solid rgba(248,81,73,0.3); }
    </style>
</head>
<body>

    <div class="portal-card">
        <h2>introverTrader ATAS Portal</h2>
        <p>Retrieving your verified subscription and license key automatically...</p>

        <div id="content-area" style="margin-top: 20px;">
            <div id="loading-state" class="loading">Authenticating with Whop...</div>
            
            <div id="success-state" style="display: none;">
                <p style="margin-bottom: 5px;">Linked Email: <strong id="user-email" style="color: #f3f4f6;"></strong></p>
                
                <div class="key-box">
                    <code id="license-key">Loading...</code>
                    <button id="copy-btn" onclick="copyKey()">Copy Key</button>
                </div>

                <p style="margin: 5px 0; font-size: 12px;">Status: <span id="license-status" style="font-weight: 600;"></span></p>
                <p style="margin: 5px 0; font-size: 12px; color: #8b949e;">Expires: <span id="license-expiry"></span></p>

                <a href="https://www.dropbox.com/scl/fi/ghsaz6p2ni58beetjhrqw/Indicators.zip?rlkey=81b9gjcl8p88hobk3u6306x2x&dl=1" target="_blank" class="btn-download">Download Latest Indicator (.zip)</a>
            </div>

            <div id="error-state" class="error" style="display: none;"></div>
        </div>
    </div>

    <script>
        const SUPABASE_FUNCTION_URL = 'https://biyozmqmdhsqbmecutyh.supabase.co/functions/v1/get-atas-license';

        async function initPortal() {
            const urlParams = new URLSearchParams(window.location.search);
            const whopUserId = urlParams.get('whop_user_id');

            // Fallback teszteléshez (ha lokálisan vagy sima böngészőből nyitod meg teszt jelleggel)
            // ?whop_user_id= user_xxx
            if (!whopUserId) {
                showError("Missing Whop user session. Please open this portal directly through your Whop product link or button.");
                return;
            }

            try {
                const response = await fetch(`${SUPABASE_FUNCTION_URL}?whop_user_id=${whopUserId}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Failed to retrieve license key.");
                }

                // Adatok kitöltése
                document.getElementById('user-email').innerText = data.email;
                document.getElementById('license-key').innerText = data.license_key;
                
                const statusSpan = document.getElementById('license-status');
                if (data.is_active) {
                    statusSpan.innerText = "Active";
                    statusSpan.style.color = "#3fb950";
                } else {
                    statusSpan.innerText = "Inactive";
                    statusSpan.style.color = "#f85149";
                }

                document.getElementById('license-expiry').innerText = data.expires_at ? new Date(data.expires_at).toLocaleDateString() : "Lifetime / Active";

                // Nézet váltás
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('success-state').style.display = 'block';

            } catch (err) {
                showError(err.message);
            }
        }

        function showError(message) {
            document.getElementById('loading-state').style.display = 'none';
            const errBox = document.getElementById('error-state');
            errBox.innerText = message;
            errBox.style.display = 'block';
        }

        window.copyKey = function() {
            const keyText = document.getElementById('license-key').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerText = "Copied!";
                btn.style.background = "#1f6feb";
                setTimeout(() => {
                    btn.innerText = "Copy Key";
                    btn.style.background = "#238636";
                }, 2000);
            });
        };

        // Futtatás indításkor
        initPortal();
    </script>
</body>
</html>
